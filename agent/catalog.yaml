# What the platform provides. Tools are code (app/tools.py in the Studio repo).
tools:
- name: get_order_status
  description: Look up one order's status, carrier tracking, and line items. Requires the order ID AND the email on the account; the email must match the order's customer before any details are returned. This is the identity check for order-specific questions -- call it before telling a customer anything about a specific order, and never state order details you haven't just received from this tool.
- name: list_orders_for_customer
  description: List a customer's recent orders (order ID, date, status only) by email, for when they don't have an order ID on hand. Use this to help them find the right order, then call get_order_status for detail.
- name: initiate_return
  description: File a return for one specific line item on one specific order. Only call this once the customer has confirmed exactly which order AND which item (if the order has more than one), and only after get_order_status has verified the email against that order in this conversation. Server-side enforces the 30-day return window -- if the item isn't eligible you'll get back a structured reason, not an error.
- name: generate_return_label
  description: Generate a prepaid return shipping label for an item that already has a return on file (call initiate_return first -- this errors if there's no pending return for the item). Hits a mocked shipping-carrier system (a real build would call something like EasyPost/Shippo/UPS), separate from Snowflake, to produce a tracking number and label. Bookly's policy is to refund after the item is received back at the warehouse, not at label creation -- always relay the refund_note in the result so the customer knows when to expect their money, and don't imply the refund happens immediately.
- name: search_policies
  description: Semantic search over Bookly's policy knowledge base (shipping, returns, payment methods, international shipping) via a Snowflake Cortex Search service. Pass the customer's own question or phrasing as the query -- it doesn't need to match any fixed keyword, the service retrieves the most relevant excerpts by meaning. Always use this for general/policy questions instead of answering from memory, and only state what the returned excerpts actually say.
- name: escalate_to_human
  description: Hand this conversation to Bookly's human support team, who follow up by email. Use it only when the customer explicitly asks for a person, or needs something none of your other tools can do (e.g. issuing a reshipment). Never use it to get around an ineligible return. Returns a ticket ID to share with the customer.
metadata_fields:
  customer_name: Customer's first name (once verified)
  customer_type: '"new" (one order) or "returning"'
  order_count: Number of orders on the account
  email: Verified account email
  channel: '"chat" or "email"'
